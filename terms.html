<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deposit &amp; Payment Terms | EZ CUSTOMZ</title>
<meta name="description" content="EZ CUSTOMZ deposit and payment terms: nonrefundable deposits, estimates and remaining balance.">
<link rel="canonical" href="https://ezcustomz.co/terms.html">
<meta name="theme-color" content="#0f0a20">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f3fb;--card:#fff;--ink:#1a1428;--mute:#6b6478;--line:#e3dded;--vio:#8f4fe0;--vio-d:#6d33b8;--soft:#f0e8fb;--night:#0f0a20;--head:'Unbounded','Arial Black',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151025;--card:#1e1736;--ink:#f1ecfa;--mute:#a79fb8;--line:#33294f;--soft:#2a1f47;--vio:#a46af0;--vio-d:#b98af5}}
:root[data-theme="dark"]{--bg:#151025;--card:#1e1736;--ink:#f1ecfa;--mute:#a79fb8;--line:#33294f;--soft:#2a1f47;--vio:#a46af0;--vio-d:#b98af5}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px clamp(16px,5vw,64px);background:var(--night);color:#fff}
.logo img{height:56px;width:auto;display:block;mix-blend-mode:screen}
.call{text-decoration:none;font-weight:600;font-size:14px;color:#fff;border:1px solid #4a3b72;padding:8px 13px;border-radius:999px;white-space:nowrap}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:28px 16px 56px}
h1{font:700 clamp(24px,5vw,32px)/1.15 var(--head);letter-spacing:-.03em;margin:0 0 6px}
.ver{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,30px)}
.card h3{font:600 18px/1.3 var(--head);letter-spacing:-.02em;margin:24px 0 8px;color:var(--vio-d)}.card h3:first-child{margin-top:0}
.card p{margin:0 0 14px}.card ul{margin:0 0 14px;padding-left:22px}.card li{margin:0 0 5px}
footer{background:#0a0615;color:#8f84a8;font-size:13px;padding:18px clamp(16px,6vw,64px);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}footer a{color:#c9bbe0;font-weight:600}
@media(max-width:600px){.logo img{height:44px}.call{font-size:13px;padding:7px 11px}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/" aria-label="EZ CUSTOMZ home"><img src="/assets/logo-header.jpg" alt="EZ CUSTOMZ" width="360" height="177"></a>
  <a class="call" href="tel:2256154554">Call or text 225.615.4554</a>
</header>
<main>
  <h1>Deposit &amp; Payment Terms</h1>
  <p class="ver" id="ver">Loading&hellip;</p>
  <article class="card" id="tx" aria-live="polite"></article>
</main>
<footer><span>&copy; 2026 EZ CUSTOMZ, Baton Rouge, Louisiana</span><span>Questions? <a href="tel:2256154554">225.615.4554</a></span><a href="/">Back to ezcustomz.co</a></footer>
<script>
/* Terms are managed in the admin panel (Terms tab) and stored in Supabase, so this page never needs editing. */
const SUPABASE_URL='https://umvdxjnhzehcoujrishh.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_bs-39zXRYYVOHmCJeV7mvg_armUMvNH';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=t=>{let h='',ul=0;for(const l of String(t).split(/\r?\n/)){const x=l.trim();
  if(x.startsWith('- ')){if(!ul){h+='<ul>';ul=1}h+='<li>'+esc(x.slice(2))+'</li>';continue}
  if(ul){h+='</ul>';ul=0}if(!x)continue;h+=x.startsWith('## ')?'<h3>'+esc(x.slice(3))+'</h3>':'<p>'+esc(x)+'</p>'}return h+(ul?'</ul>':'')};
fetch(SUPABASE_URL+'/rest/v1/rpc/get_deposit_terms',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:'{}'})
  .then(r=>r.ok?r.json():Promise.reject()).then(([t])=>{
    if(!t){$('ver').textContent='Our deposit terms are being finalized. Call or text 225.615.4554 with any questions.';$('tx').hidden=true;return}
    $('ver').textContent='Version '+t.version+(t.published_at?', effective '+new Date(t.published_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'America/Chicago'}):'');
    $('tx').innerHTML=md(t.body)})
  .catch(()=>{$('ver').textContent="We couldn't load the terms right now. Please refresh, or call or text 225.615.4554.";$('tx').hidden=true});
</script>
</body>
</html>
